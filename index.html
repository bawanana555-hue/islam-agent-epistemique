<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Islam Agent Épistémique</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lato:wght@300;400;700&display=swap');

        :root {
            --bg-main: #FFEFD5;
            --orange-creme: #FFF5E1;
            --orange-clair: #FFB347;
            --orange-fonce: #E67E22;
            --vert-clair: #2ECC71;
            --bleu-ciel: #87CEEB;
            --text-main: #2C3E50;
            --highlight: #FFFF00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body { 
            background: var(--bg-main); 
            font-family: 'Lato', sans-serif; 
            color: var(--text-main); 
            display: flex; flex-direction: column; 
            height: 100dvh; overflow: hidden; 
        }

        /* --- Header --- */
        .header { 
            position: fixed; top: 0; left: 0; right: 0; 
            background: var(--bg-main); padding: 15px 10px; 
            z-index: 100; text-align: center;
            transition: all 0.4s ease;
        }

        .header-row { display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; }
        
        .welcome-area h1 { font-family: 'Amiri', serif; color: #3498DB; font-size: 1.4em; }
        .welcome-area .sub1 { color: #8E44AD; font-size: 1.1em; font-weight: bold; }
        .welcome-area .sub2 { color: #16A085; font-size: 0.9em; font-style: italic; }

        /* --- Chat --- */
        .chat-container { 
            flex: 1; margin-top: 160px; padding: 20px 15px 180px; 
            overflow-y: auto; display: flex; flex-direction: column; 
        }

        .msg { 
            max-width: 85%; margin-bottom: 20px; padding: 16px; 
            border-radius: 18px; font-size: 16px; line-height: 1.6;
            border: 2px solid var(--vert-clair);
            background: var(--orange-creme);
            position: relative;
        }

        .user-msg { align-self: flex-end; border-color: var(--orange-clair); border-bottom-right-radius: 2px; }
        .bot-msg { align-self: flex-start; border-bottom-left-radius: 2px; }

        /* --- Lecture Fascinante --- */
        .speaking { background: var(--highlight) !important; transition: background 0.3s; }
        .audio-controls { margin-top: 10px; display: flex; gap: 10px; }
        .btn-audio { background: var(--bleu-ciel); border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 0.8em; }

        /* --- Footer & Input --- */
        .input-wrapper { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-main); padding: 10px 15px 25px; }
        .input-area { 
            display: flex; background: var(--orange-creme); 
            border: 2px solid var(--vert-clair); border-radius: 30px; 
            padding: 8px; max-width: 600px; margin: 0 auto; 
        }
        .input-area input { flex: 1; border: none; background: transparent; outline: none; padding: 10px; font-size: 16px; }
        .send-btn { background: var(--vert-clair); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; }

        .reading-mode .header { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        .reading-mode .chat-container { margin-top: 20px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div class="header" id="main-header">
    <div class="header-row">
        <button onclick="toggleModal('modal-dons', true)" style="background:var(--vert-clair); color:white; border:none; padding:8px 15px; border-radius:20px;">DONS</button>
        <div style="width:45px; height:45px; border:2px solid var(--vert-clair); border-radius:10px; background:white;"></div>
        <button onclick="toggleModal('modal-profil', true)" style="background:var(--orange-clair); color:white; border:none; padding:8px 15px; border-radius:20px;">PROFIL</button>
    </div>
    <div class="welcome-area">
        <h1>Islam Agent Épistémique</h1>
        <div class="sub1">Théologie & Épistémologie</div>
        <div class="sub2">Premier Agent Épistémique d'Afrique</div>
    </div>
</div>

<div class="chat-container" id="chat"></div>

<div class="input-wrapper">
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Posez une question..." onfocus="document.body.classList.add('reading-mode')">
        <button class="send-btn" onclick="handleChat()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<!-- Modal Profil -->
<div id="modal-profil" class="modal">
    <div class="modal-content">
        <h3>Configuration</h3>
        <input type="password" id="api-key" placeholder="Clé API Gemini" style="width:100%; margin:10px 0; padding:10px;">
        <button onclick="saveKey()" style="width:100%; padding:10px; background:var(--vert-clair); color:white; border:none;">Sauvegarder</button>
        <button onclick="toggleModal('modal-profil', false)" style="width:100%; margin-top:5px;">Fermer</button>
    </div>
</div>

<script>
    // --- BASE DE CONNAISSANCES SOLIDE (LOCALE) ---
    const KNOWLEDGE_BASE = [
        { key: "tauhid", content: "Le Tauhid est l'unicité de Dieu. C'est le pilier central de l'islam, divisé en Rububiyya, Uluhiyya et Asma wa Sifat." },
        { key: "piliers", content: "Les 5 piliers sont : la Shahada, la Salat, la Zakat, le Sawm et le Hajj." },
        { key: "epistemologie", content: "L'épistémologie islamique lie la révélation ('Aql) et la raison (Naql) pour atteindre la vérité." }
    ];

    const SYSTEM_PROMPT = "Tu es l'Islam Agent Épistémique d'Afrique. Utilise un ton noble. Si politique violente : 'Je ne suis pas fait pour ça. Car ma compétence n'a aucun lien avec ce monde'.";

    function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
    function saveKey() { localStorage.setItem('gemini_key', document.getElementById('api-key').value); toggleModal('modal-profil', false); }

    async function handleChat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim().toLowerCase();
        if(!text) return;

        addMsg(text, 'user');
        input.value = '';

        // 1. Check Base de Connaissance Locale (Sans moteur)
        let localMatch = KNOWLEDGE_BASE.find(item => text.includes(item.key));
        if(localMatch) {
            setTimeout(() => addMsg("💡 [Base Locale] : " + localMatch.content, 'bot'), 500);
            return;
        }

        // 2. Appel Moteur IA Gratuit (Gemini)
        const key = localStorage.getItem('gemini_key');
        if(!key) { addMsg("Veuillez configurer votre clé API dans Profil.", 'bot'); return; }

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
                    contents: [{ role: "user", parts: [{ text: text }] }]
                })
            });
            const data = await resp.json();
            const reply = data.candidates[0].content.parts[0].text;
            addMsg(reply, 'bot');
        } catch (e) {
            addMsg("Erreur de connexion. Vérifiez votre clé ou quota gratuit.", 'bot');
        }
    }

    function addMsg(text, side) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `msg ${side}-msg`;
        
        if(side === 'bot') {
            div.innerHTML = `<div>${marked.parse(text)}</div>
                            <div class="audio-controls">
                                <button class="btn-audio" onclick="speakText(this)">Play 🔊</button>
                            </div>`;
        } else {
            div.textContent = text;
        }
        
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // --- MINI-APP AUDIO-VISUELLE (SUIVI MOT A MOT) ---
    function speakText(btn) {
        const msgDiv = btn.closest('.msg');
        const text = msgDiv.querySelector('div').innerText;
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 0.9;

        utterance.onstart = () => msgDiv.classList.add('speaking');
        utterance.onend = () => msgDiv.classList.remove('speaking');
        
        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
