<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Islam Agent Épistémique</title>
<style>
  :root {
    --bg-main: #F6EDCC;
    --text-main: #111111;
    --vert-clair: #2ECC71;
    --bleu-ciel: #87CEEB;
    --orange-clair: #FFB366;
    --champ-fond: #FFFFFF;
  }
  body {
    margin: 0;
    background: var(--bg-main);
    font-family: 'Lato', 'Georgia', serif;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 10px;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    pointer-events: auto;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 10px;
    gap: 4px;
  }
  .button-oval {
    padding: 6px 14px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.75em;
    font-weight: bold;
    background: var(--champ-fond);
    border: 2px solid transparent;
    transition: all 0.22s;
  }
  #dons-btn {
    border-color: var(--vert-clair);
    color: var(--vert-clair);
  }
  #dons-btn:hover {
    background: var(--vert-clair);
    color: white;
  }
  #audio-btn {
    border-color: var(--bleu-ciel);
    color: var(--bleu-ciel);
  }
  #audio-btn:hover {
    background: var(--bleu-ciel);
    color: #111;
  }
  #profil-btn {
    border-color: var(--orange-clair);
    color: var(--orange-clair);
  }
  #profil-btn:hover {
    background: var(--orange-clair);
    color: #111;
  }

  /* Textes d'accueil */
  .welcome-text {
    margin-top: 120px; /* pour laisser la place au header */
    padding: 0 20px;
    text-align: center;
    user-select: none;
  }
  .welcome-text .titre-agent {
    font-size: 2.5em;
    font-weight: 900;
    color: var(--bleu-ciel);
    margin-bottom: 0.3em;
  }
  .welcome-text .subtitle {
    font-size: 1.5em;
    font-weight: 700;
    color: var(--orange-clair);
    margin-bottom: 0.3em;
  }
  .welcome-text .description {
    font-size: 1.2em;
    font-weight: 600;
    color: var(--vert-clair);
    margin-bottom: 1em;
  }

  /* Section IA */
  .ai-interface {
    padding: 0 20px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  input, button {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
    font-size: 1em;
  }
  input:focus {
    outline: 3px solid var(--bleu-ciel);
    border-color: var(--bleu-ciel);
  }
  #responseArea {
    background: var(--champ-fond);
    padding: 15px;
    border-radius: 8px;
    min-height: 100px;
    border: 1px solid #ddd;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <button class="button-oval" id="dons-btn">Dons</button>
    <button class="button-oval" id="audio-btn">Audio</button>
    <button class="button-oval" id="profil-btn">Profil</button>
  </div>
</div>

<!-- Textes d'accueil -->
<div class="welcome-text" aria-label="Textes d'accueil">
  <div class="titre-agent">Islam Agent Épistémique</div>
  <div class="subtitle">Bienvenue sur les pages de la théologie islamique</div>
  <div class="description">Je suis votre premier Agent Épistémique d'Afrique pour l'islam</div>
</div>

<!-- Section IA -->
<div class="ai-interface">
  <input type="text" id="userQuery" placeholder="Posez votre question sur le Coran..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
  <button onclick="processQuery()">Interroger l'Agent</button>
  <div id="responseArea" role="region" aria-live="polite">Les réponses s'afficheront ici.</div>
  
  <hr>
  <label for="apiKey">Configuration (Clé API Gemini) :</label>
  <input type="password" id="apiKey" placeholder="Collez votre clé API Google Gemini ici" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
</div>

<script>
  // Activation des boutons pour test
  document.getElementById('dons-btn').onclick = function() {
    alert("Bouton Dons cliqué !");
  };
  document.getElementById('profil-btn').onclick = function() {
    alert("Bouton Profil cliqué !");
  };

  // Fonction IA
  const knowledgeBaseEngine = "Google-Gemini-Pro";

  async function processQuery() {
    const query = document.getElementById('userQuery').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const responseArea = document.getElementById('responseArea');

    if (!query) {
      responseArea.innerText = "Veuillez poser une question.";
      return;
    }

    if (!apiKey) {
      responseArea.innerText = "Erreur : Clé API manquante. Veuillez la renseigner dans le champ ci-dessous.";
      return;
    }

    responseArea.innerText = "L'Agent réfléchit...";

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: query }] }]
        })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        responseArea.innerText = data.candidates[0].content.parts[0].text;
      } else {
        responseArea.innerText = "Réponse non disponible ou clé invalide.";
      }
    } catch (error) {
      responseArea.innerText = "Erreur technique : " + error.message;
    }
  }
</script>

</body>
</html>
