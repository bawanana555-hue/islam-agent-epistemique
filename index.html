
 
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent IA Islamique</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #FFF2DF; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
  header { background: #27ae60; color: white; padding: 10px; text-align: center; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; background: white; }
  .msg { max-width: 80%; margin-bottom: 15px; padding: 10px; border-radius: 10px; }
  .user-msg { background: #fffcf5; align-self: flex-end; border-right: 5px solid #E67E22; }
  .bot-msg { background: #e0f2e9; border-left: 5px solid #27ae60; }
  #input-area { display: flex; padding: 10px; background: #fff; border-top: 2px solid #27ae60; }
  #userInput { flex: 1; padding: 10px; font-size: 16px; border-radius: 20px; border: 2px solid #27ae60; outline: none; }
  #sendBtn { background: #27ae60; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  #loader { display: none; margin-left: 10px; align-self: center; }
  .dot { width: 8px; height: 8px; background: #27ae60; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite; margin: 0 2px; }
  @keyframes bounce { 0%, 100% { transform: scale(0.3); } 50% { transform: scale(1); } }
  #apiKeyModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
  #apiKeyModalContent { background: white; padding: 20px; border-radius: 10px; width: 300px; }
  #apiKeyInput { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
  #saveApiKeyBtn { margin-top: 10px; background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>Agent IA Islamique</h1>
  <button onclick="openApiKeyModal()">Configurer la clé API</button>
</header>

<div id="messages" style="display:flex; flex-direction: column;"></div>

<div id="input-area">
  <input type="text" id="userInput" placeholder="Posez votre question..." autocomplete="off" autocorrect="off" spellcheck="false" />
  <button id="sendBtn" onclick="askAgent()">➔</button>
  <div id="loader">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>

<!-- Modal clé API -->
<div id="apiKeyModal" style="display:flex;">
  <div id="apiKeyModalContent">
    <h3>Clé API Google Gemini</h3>
    <input type="password" id="apiKeyInput" placeholder="Entrez votre clé API" />
    <button id="saveApiKeyBtn" onclick="saveApiKey()">Enregistrer</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // Base de connaissances locale
  const LOCAL_KNOWLEDGE = {
    "qui es-tu": "Je suis l'Agent Épistémique d'Afrique pour l'Islam, conçu pour fournir des connaissances académiques et théologiques.",
    "salutation": "Salam Alaykoum. Comment puis-je vous aider dans votre quête de savoir aujourd'hui ?",
    "dons": "Vous pouvez soutenir ce projet via Flooz, T-Money ou CinetPay."
  };

  // Affichage des messages
  function addM(text, sender) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + (sender === 'bot' ? 'bot-msg' : 'user-msg');
    div.innerHTML = sender === 'bot' ? marked.parse(text) : text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  // Affiche le loader
  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'inline-block' : 'none';
  }

  // Ouvre la modal clé API
  function openApiKeyModal() {
    document.getElementById('apiKeyModal').style.display = 'flex';
    document.getElementById('apiKeyInput').value = localStorage.getItem('iae_key') || '';
  }

  // Sauvegarde la clé API
  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert("Veuillez entrer une clé API valide.");
      return;
    }
    localStorage.setItem('iae_key', key);
    alert("Clé API enregistrée !");
    document.getElementById('apiKeyModal').style.display = 'none';
  }

  // Fonction principale pour poser une question
  async function askAgent() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();
    if (!question) return;

    addM(question, 'user');
    input.value = '';
    showLoader(true);

    // Recherche dans la base locale
    let localResponse = "";
    const qLower = question.toLowerCase();
    for (const key in LOCAL_KNOWLEDGE) {
      if (qLower.includes(key)) {
        localResponse = LOCAL_KNOWLEDGE[key];
        break;
      }
    }

    if (localResponse) {
      setTimeout(() => {
        addM(localResponse, 'bot');
        showLoader(false);
      }, 500);
      return;
    }

    // Appel API Google Gemini
    const apiKey = localStorage.getItem('iae_key');
    if (!apiKey) {
      addM("Erreur : Clé API manquante. Veuillez configurer votre clé dans le profil.", 'bot');
      showLoader(false);
      return;
    }

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: "En tant qu'agent islamique académique, réponds précisément : " + question
            }]
          }]
        })
      });

      if (!response.ok) {
        addM(`Erreur serveur : ${response.status} ${response.statusText}`, 'bot');
        showLoader(false);
        return;
      }

      const data = await response.json();
      if (data.candidates && data.candidates.length > 0 &&
          data.candidates[0].content && data.candidates[0].content.parts &&
          data.candidates[0].content.parts.length > 0) {
        addM(data.candidates[0].content.parts[0].text, 'bot');
      } else {
        addM("Désolé, la réponse de l'agent est vide ou mal formée.", 'bot');
      }
    } catch (error) {
      addM("Désolé, une erreur est survenue. Vérifiez votre clé API et votre connexion.", 'bot');
      console.error(error);
    }
    showLoader(false);
  }

  // Initialisation au chargement
  window.onload = () => {
    addM("Bienvenue Cher Chercheur de Vérité. Posez votre première question.", 'bot');
    if (!localStorage.getItem('iae_key')) {
      openApiKeyModal();
    } else {
      document.getElementById('apiKeyModal').style.display = 'none';
    }
  };
</script>

</body>
</html>
